android.useAndroidX=true
android.enableJetifier=true
# Daemon JVM is selected portably via gradle/gradle-daemon-jvm.properties
# (toolchainVersion=17) — Gradle discovers a JDK 17 on the machine (or CI's
# setup-java JDK) — instead of a machine-specific org.gradle.java.home path.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
