# Project-wide Gradle settings

# Framework versioning (semantic versioning)
FRAMEWORK_VERSION=1.0.0

# Android SDK versions
COMPILE_SDK=35
MIN_SDK=24
TARGET_SDK=35

# Dependency versions
KOTLIN_VERSION=1.9.22
COMPOSE_VERSION=1.5.4
COMPOSE_MATERIAL3_VERSION=1.1.2
HILT_VERSION=2.50
CAMERAX_VERSION=1.3.0
LIFECYCLE_VERSION=2.6.2
NAVIGATION_VERSION=2.7.5

# Testing dependencies
JUNIT_VERSION=4.13.2
ANDROIDX_TEST_VERSION=1.3.0-rc01
MOCKITO_VERSION=5.5.0
ROBOLECTRIC_VERSION=4.13
JACOCO_VERSION=0.8.10

# Gradle settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Kotlin settings
kotlin.code.style=official

# AndroidX settings
android.useAndroidX=true
android.enableJetifier=true
# BouncyCastle is a pure-Java library (no android.support.* refs) and ships
# multi-release classes (META-INF/versions/25) that the bundled Jetifier in
# AGP 8.7.2 cannot parse. Skip it from Jetifier. See issuetracker 184622491.
android.jetifier.ignorelist=bcprov-jdk18on,bcpkix-jdk18on
android.suppressUnsupportedCompileSdk=35

# Dependency management
USE_PUBLISHED_FRAMEWORK=false
