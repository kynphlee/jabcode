name: Android Benchmark Compile Validation

# Validates that the Android benchmark sources still compile and that
# the benchmark APK and macrobenchmark module assemble cleanly. Catches
# breakage when shared code is edited.
#
# DOES NOT EXECUTE THE BENCHMARKS. Benchmark execution requires a real
# device (CI emulators produce inaccurate / flaky results, and
# Macrobenchmark explicitly warns against emulator runs). Benchmarks are
# run locally against a connected Android device. See
# `jabauth-android/research-docs/implementation-plans/framework/BENCHMARK_TESTING_GUIDE.md`
# § "Implementation Status" for the local run commands.
on:
  pull_request:
    paths:
      - 'jabauth-android/framework/**'
      - 'jabauth-android/diagnostic-app/**'
      - 'jabauth-android/benchmark-macro/**'
      - 'jabauth-android/build.gradle.kts'
      - 'jabauth-android/settings.gradle.kts'
      - 'jabauth-android/gradle/**'
      - '.github/workflows/benchmark.yml'
  push:
    branches: [main, master, swift-java-poc]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-benchmark-sources:
    name: Compile benchmark sources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # Validates: BenchmarkSuite concrete impl (per-Nc decoder benchmarks)
      - name: Compile diagnostic-engine androidTest
        working-directory: jabauth-android
        run: ./gradlew :framework:diagnostic-engine:compileDebugAndroidTestKotlin --no-daemon

      # Validates: Jetpack Microbenchmark classes (Camera enum, Stream
      # validation, Image quality)
      - name: Compile jabcode-sdk androidTest
        working-directory: jabauth-android
        run: ./gradlew :framework:jabcode-sdk:compileDebugAndroidTestKotlin --no-daemon

      # Validates: Macrobenchmark module + target diagnostic-app benchmark
      # build variant + Trace section instrumentation
      - name: Assemble macrobenchmark + benchmark variant
        working-directory: jabauth-android
        run: ./gradlew :benchmark-macro:assembleBenchmark --no-daemon

      # Catches regressions in the production hot-path code that the
      # macrobenchmark targets (Camera2JABCodeAnalyzer trace sections,
      # ScannerViewModel PerformanceTracker wiring)
      - name: Build diagnostic-app debug
        working-directory: jabauth-android
        run: ./gradlew :diagnostic-app:assembleDebug --no-daemon
