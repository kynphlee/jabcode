name: Android Benchmarks

# Triggered by:
#   - PRs touching benchmark-relevant code paths (catches regressions early)
#   - Pushes to the main branch (long-term trend tracking)
#   - Nightly cron (drift detection even without code changes)
#   - Manual dispatch (on-demand baseline refresh)
on:
  pull_request:
    paths:
      - 'jabauth-android/framework/**'
      - 'jabauth-android/diagnostic-app/**'
      - 'jabauth-android/benchmark-macro/**'
      - 'jabauth-android/build.gradle.kts'
      - 'jabauth-android/settings.gradle.kts'
      - 'jabauth-android/gradle/**'
      - '.github/workflows/benchmark.yml'
  push:
    branches: [main, master, swift-java-poc]
  schedule:
    - cron: '0 8 * * *'  # 08:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # for posting benchmark deltas as PR comments

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Microbenchmarks — fast, component-level, runs on every PR
  # Tests: CameraEnumeration, StreamValidation, ImageQualityAnalysis
  # Target frame budget: 16ms per BENCHMARK_TESTING_GUIDE.md
  # ──────────────────────────────────────────────────────────────────────
  microbenchmark:
    name: Microbenchmark (jabcode-sdk)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Enable KVM (required for Android emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run microbenchmarks on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # Disable animations + lock CPU clocks for stable measurements
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            cd jabauth-android
            ./gradlew :framework:jabcode-sdk:connectedCheck \
              -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR,UNLOCKED \
              --no-daemon

      - name: Upload microbenchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microbenchmark-results-${{ github.run_id }}
          path: jabauth-android/framework/jabcode-sdk/build/outputs/connected_android_test_additional_output/**/*

  # ──────────────────────────────────────────────────────────────────────
  # BenchmarkSuite per-Nc — synthetic decoder benchmarks across all 8 Nc
  # Tests: JABCodeDecodeBenchmark (Nc=0..7)
  # ──────────────────────────────────────────────────────────────────────
  benchmark-suite:
    name: BenchmarkSuite (diagnostic-engine)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run per-Nc decode benchmarks on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            cd jabauth-android
            ./gradlew :framework:diagnostic-engine:connectedCheck --no-daemon

      - name: Upload BenchmarkSuite logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-suite-logs-${{ github.run_id }}
          path: jabauth-android/framework/diagnostic-engine/build/outputs/androidTest-results/**/*

  # ──────────────────────────────────────────────────────────────────────
  # Macrobenchmarks — end-to-end, only on main + nightly + manual dispatch
  # (Skipped on PRs because they're slow and noisy under emulation)
  # Tests: CameraStartup, FrameProcessing, JABCodeDecode end-to-end
  # ──────────────────────────────────────────────────────────────────────
  macrobenchmark:
    name: Macrobenchmark (benchmark-macro)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run macrobenchmarks on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          disable-animations: true
          script: |
            cd jabauth-android
            ./gradlew :benchmark-macro:connectedBenchmarkAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR,UNLOCKED \
              --no-daemon

      - name: Upload macrobenchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macrobenchmark-results-${{ github.run_id }}
          path: jabauth-android/benchmark-macro/build/outputs/connected_android_test_additional_output/**/*
